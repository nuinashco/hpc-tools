[project]
name = "hpc-tools"
version = "0.1.0"
description = "Claude Code plugins for HPC systems, one per system: submit, watch and budget jobs"
readme = "README.md"
# What the development tools need. A plugin's own code has no dependencies and runs on
# Python 3.9, the one a Mac ships: ruff, pyright and `make test-oldest` hold it to that.
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "conventions-hooks",
    "pre-commit>=4.0",
    "pyright[nodejs]>=1.1.400",
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.uv.sources]
conventions-hooks = { git = "https://github.com/nuinashco/conventions", rev = "b54db1540c7bcd2da7e3a86608ac4fa998206775" }

[tool.ruff]
line-length = 88
target-version = "py39"
src = ["plugins/jupiter/lib", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.9"
extraPaths = ["plugins/jupiter/lib"]
include = ["plugins/jupiter/lib", "tests", "tools"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
pythonpath = ["plugins/jupiter/lib"]
testpaths = ["tests"]
# Each plugin's tests sit in their own directory, where file names repeat.
addopts = "--import-mode=importlib"
